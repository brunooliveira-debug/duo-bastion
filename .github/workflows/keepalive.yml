# A Supabase Free project is paused after 7 days without any request: this tiny read keeps the duo lobbies and the
# daily leaderboard reachable even during a quiet week. The publishable key below is public by design (it ships in
# the game bundle and is protected by row level security); no secret is involved.
name: Keep Supabase awake
on:
  schedule:
    - cron: '23 6 * * 1,4' # Monday and Thursday, 06:23 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one public row
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: sb_publishable_f97BA2cvOHAcJgu3ZXx8_w_CPjeg3or" \
            -H "Authorization: Bearer sb_publishable_f97BA2cvOHAcJgu3ZXx8_w_CPjeg3or" \
            "https://evadmavhnpabnckyddap.supabase.co/rest/v1/duo_records?select=pair_key&limit=1")
          echo "Supabase answered HTTP $code"
          case "$code" in 200|401|403) exit 0 ;; *) exit 1 ;; esac
